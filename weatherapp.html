<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="weatherapp.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">

            <div>
                <h1>🌤️ Weather Dashboard</h1>
                <p>Check current weather and 5-day forecast</p>
            </div>

            <button id="themeBtn" class="theme-btn">
                🌙 Dark
            </button>

        </header>


        <!-- Search -->
        <section class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >

            <button id="searchBtn">
                Search
            </button>

            <!-- Suggestions -->
            <div id="suggestions" class="suggestions"></div>

        </section>


        <!-- Loading -->
        <div id="loading" class="loading">

            <div class="spinner"></div>

            <p>Loading weather...</p>

        </div>


        <!-- Error -->
        <div id="errorMsg" class="error"></div>


        <!-- Current Weather -->
        <section
            id="weatherCard"
            class="weather-card"
            style="display: none;"
        ></section>


        <!-- Forecast -->
        <section
            id="forecastSection"
            style="display: none;"
        >

            <h2>5-Day Forecast</h2>

            <div
                id="forecastContainer"
                class="forecast-container"
            ></div>

        </section>


         <!-- Favorites -->
      <section class="favorites-section">

    <h2>⭐ Favorite Cities</h2>

    <div id="favoritesList">
        <!-- Favorite items will appear here automatically -->
    </div>

        </section>

    </div>


    <script src="weatherapp.js"></script>

</body>
</html>
